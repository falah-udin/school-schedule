version: '3.8'

services:
  # 1. Layanan Web Server (Nginx) dan PHP
  app:
    image: nginx:alpine
    container_name: school-master-app
    ports:
      - "8082:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
      - mariadb
    restart: unless-stopped

  # 2. Layanan PHP-FPM (PHP 7.4 untuk kompatibilitas Laravel 5.3)
  php:
    image: php:7.4-fpm-alpine
    container_name: school-master-php
    volumes:
      - .:/var/www/html
    restart: unless-stopped

  # 3. Layanan Database (MariaDB)
  mariadb:
    image: mariadb:10.11
    container_name: school-master-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: school_db
      MYSQL_USER: school_user
      MYSQL_PASSWORD: password123
    volumes:
      - ./mysql_data:/var/lib/mysql
    restart: unless-stopped